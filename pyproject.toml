[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mini-secure-agent"
version = "0.1.0"
description = "A lean security gateway for small and medium AI agent projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Victor Fang"}]
dependencies = [
  "anyio>=4.10,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "regex>=2025.7.34",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://VictorFang.com"
X = "https://X.com/vicfcs"
LinkedIn = "https://www.linkedin.com/in/drvictorfang"

[project.optional-dependencies]
langchain = ["langchain-core>=1.6.3,<2"]
demos = [
  "langchain-core>=1.6.3,<2",
  "langchain-openai>=1.6.2,<2",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12.20260906",
  "types-regex>=2026.9.10.20260911",
]

[project.scripts]
msa = "mini_secure_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_secure_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/mini_secure_agent/api.py" = ["B008"]
"src/mini_secure_agent/cli.py" = ["B008"]
"src/mini_secure_agent/config.py" = ["S104", "S105"]
"tests/*" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mini_secure_agent"]

[[tool.mypy.overrides]]
module = ["langchain_core", "langchain_core.*"]
ignore_missing_imports = true
