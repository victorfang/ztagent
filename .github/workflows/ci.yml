name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ZTAgent and QA dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,demos]'
      - name: Install pinned Open Policy Agent
        env:
          OPA_VERSION: 1.20.2
          OPA_SHA256: 69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f
        run: |
          curl --fail --silent --show-error --location \
            --output opa_linux_amd64_static \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa_linux_amd64_static" | sha256sum --check
          sudo install -m 0755 opa_linux_amd64_static /usr/local/bin/opa
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
